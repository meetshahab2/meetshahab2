{% extends "base.html" %}

{% block title %}
{{ page.meta_title|default:page.title }}
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-10">

            <h1 class="mb-4">{{ page.title }}</h1>

            <div class="page-content">
                {{ page.content|safe }}
            </div>

            <a href="/" class="btn btn-primary mt-4">
                ← Home
            </a>

        </div>
    </div>

</div>

{% endblock %}
