{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}

<section class="section">
    <div class="container">

    {% if post.category %}
        <span class="category">{{ post.category.name }}</span>
    {% endif %}

    <h1>{{ post.title }}</h1>

    {{ post.description|safe }}



<a href="{% url 'blog:index' %}" class="back-link">
    ← Back to all posts
</a>

    </div>
</section>

{% endblock %}
